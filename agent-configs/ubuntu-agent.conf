<!--
  ubuntu-agent.conf
  Custom <localfile> blocks from /var/ossec/etc/ossec.conf on ubuntu-zrahman.
  Excerpt, not a drop-in replacement.

  Note: Ubuntu 24.04 sends auth events to the systemd journal, so the agent
  reads journald directly rather than tailing /var/log/auth.log (which does not
  exist). OpenSSH 9.8 also handles connections in an `sshd-session` process,
  so `journalctl _COMM=sshd` misses them — use `journalctl -u ssh`.
-->

<ossec_config>
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/error.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>
  <!--
    Debian package manager log - every install, upgrade, and removal. Ships in
    the default agent config, not added for this lab, but kept deliberately:
    unexpected package installation is a persistence and tooling indicator
    (netcat, socat, or a compiler appearing on a server that should have none).
    Stock rules 2900-series cover it. Natural candidate for a future Linux rule.
  -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>
</ossec_config>